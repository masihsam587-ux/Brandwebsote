<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F5F0E6">
<title>Cinematic Arts — Luxury Atelier, Peshawar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ================= IVORY · EMERALD · CHAMPAGNE — DESIGN SYSTEM ================= */
:root{
--paper:#F5F0E6;--card:#FCFAF4;--sand:#EAE1CE;--sand2:#F0E9DA;
--ink:#221E17;--soft:#6E6553;--faint:#9A9080;
--em:#0F3D2E;--em2:#175641;--emL:#E3EBE2;
--gold:#C2A05A;--goldD:#8F6B21;--goldL:#EFE4C8;
--ox:#7C2D26;--oxL:#F2E2DC;
--line:rgba(34,30,23,.12);--line2:rgba(34,30,23,.22);
--glass:rgba(252,250,244,.78);--glass2:rgba(252,250,244,.92);
--ok:#2E6B4F;--warn:#9A6B1F;--bad:#9C3A2E;
--serif:"Fraunces",Georgia,serif;--sans:"Manrope",system-ui,sans-serif;--mono:"Space Mono",monospace;
--r1:12px;--r2:20px;--r3:30px;
--sh:0 24px 60px -28px rgba(34,30,23,.35);--sh2:0 10px 30px -14px rgba(34,30,23,.22);
--e:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);
--tabh:72px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:16px;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(900px 500px at 8% -5%,rgba(194,160,90,.14),transparent 60%),radial-gradient(900px 600px at 105% 15%,rgba(15,61,46,.08),transparent 60%),radial-gradient(700px 500px at 50% 115%,rgba(124,45,38,.06),transparent 60%)}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
img,svg{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
ul{list-style:none}
::selection{background:var(--gold);color:var(--ink)}
:focus-visible{outline:2px solid var(--goldD);outline-offset:3px;border-radius:6px}
[data-ic]{display:inline-flex;width:1.15em;height:1.15em;flex:none}
[data-ic] svg{width:100%;height:100%}
.serif{font-family:var(--serif)}
.d1{font-family:var(--serif);font-weight:500;font-size:clamp(2.7rem,7.5vw,5.4rem);line-height:1.02;letter-spacing:-.015em}
.d2{font-family:var(--serif);font-weight:500;font-size:clamp(2rem,4.6vw,3.4rem);line-height:1.06;letter-spacing:-.01em}
.d3{font-family:var(--serif);font-weight:500;font-size:clamp(1.4rem,2.6vw,2rem);line-height:1.15}
.it{font-style:italic;color:var(--goldD);font-weight:400}
.lbl{font-family:var(--mono);font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--soft)}
.lbl.gold{color:var(--goldD)}
.price{font-family:var(--mono);font-weight:700}
.mut{color:var(--soft)}
.wrap{max-width:1360px;margin:0 auto;padding:0 1.25rem;position:relative;z-index:1}
@media(min-width:768px){.wrap{padding:0 2.5rem}}
section.blk{padding:4.5rem 0}
.stitch{border:1.5px dashed var(--line2)}
.icx{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;background:var(--emL);color:var(--em);flex:none}
.icx.gold{background:var(--goldL);color:var(--goldD)}
.icx.ox{background:var(--oxL);color:var(--ox)}
/* ---------- buttons ---------- */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:.55rem;padding:.95rem 1.7rem;border-radius:999px;font-weight:800;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;border:1.5px solid transparent;transition:transform .3s var(--e),box-shadow .3s var(--e),background .3s,color .3s,border-color .3s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.96)}
.btn-p{background:var(--em);color:#F7F2E6}
.btn-p::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(194,160,90,.45) 50%,transparent 70%);transform:translateX(-120%);transition:transform .8s var(--e)}
.btn-p:hover{background:var(--em2);transform:translateY(-2px);box-shadow:0 14px 30px -12px rgba(15,61,46,.5)}
.btn-p:hover::after{transform:translateX(120%)}
.btn-g{background:linear-gradient(135deg,#D8B878,var(--gold) 55%,#A8842F);color:#241D0E;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.btn-g:hover{transform:translateY(-2px);box-shadow:0 14px 30px -12px rgba(143,107,33,.55),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-o{border-color:var(--line2);color:var(--ink);background:var(--glass)}
.btn-o:hover{border-color:var(--em);color:var(--em);transform:translateY(-2px)}
.btn-d{background:var(--ink);color:var(--paper)}
.btn-d:hover{transform:translateY(-2px)}
.btn-x{background:var(--ox);color:#F7EFEA}
.btn-x:hover{background:#8E372E;transform:translateY(-2px)}
.btn-lg{padding:1.15rem 2.1rem;font-size:.82rem}
.btn-sm{padding:.55rem 1rem;font-size:.66rem}
.btn-block{width:100%}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .6s var(--e);pointer-events:none}
.btn-o .ripple,.btn-g .ripple{background:rgba(15,61,46,.18)}
@keyframes rip{to{transform:scale(4);opacity:0}}
/* ---------- intro (FAIL-SAFE: auto-hides via CSS even if JS fails) ---------- */
#intro{position:fixed;inset:0;z-index:9999;background:var(--paper);display:flex;align-items:center;justify-content:center;transition:opacity .6s var(--e);overflow:hidden;animation:introBye .5s ease 3.9s forwards}
#intro.out{opacity:0;pointer-events:none}
@keyframes introBye{to{opacity:0;visibility:hidden}}
#intro .ring{position:absolute;width:min(78vw,560px);aspect-ratio:1;border-radius:50%;border:1.5px dashed rgba(143,107,33,.35);animation:spin 30s linear infinite}
#intro .ring.r2{width:min(58vw,400px);border-color:rgba(15,61,46,.25);animation-direction:reverse;animation-duration:22s}
@keyframes spin{to{transform:rotate(360deg)}}
.intro-in{position:relative;text-align:center;padding:2rem}
.intro-mono{font-family:var(--serif);font-weight:600;font-size:clamp(3.4rem,12vw,6.5rem);color:var(--em);line-height:1;letter-spacing:.04em;opacity:0;transform:scale(.8);animation:monoIn 1s var(--spring) .15s forwards}
.intro-mono em{font-style:italic;color:var(--goldD)}
@keyframes monoIn{to{opacity:1;transform:scale(1)}}
.intro-name{margin-top:1rem;font-family:var(--serif);font-size:clamp(1.5rem,5vw,2.6rem);letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.intro-name b{display:inline-block;font-weight:500;opacity:0;transform:translateY(24px);animation:letIn .7s var(--e) forwards}
@keyframes letIn{to{opacity:1;transform:translateY(0)}}
.intro-line{height:2px;width:120px;margin:1.2rem auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent);transform:scaleX(0);animation:lineIn .9s var(--e) 1.6s forwards}
@keyframes lineIn{to{transform:scaleX(1)}}
.intro-sub{margin-top:1rem;font-family:var(--mono);font-size:.68rem;letter-spacing:.4em;text-transform:uppercase;color:var(--goldD);opacity:0;animation:fadeIn .8s var(--e) 2s forwards}
@keyframes fadeIn{to{opacity:1}}
.intro-skip{position:absolute;bottom:calc(1.6rem + env(safe-area-inset-bottom));right:1.6rem;display:inline-flex;align-items:center;gap:.5rem;padding:.7rem 1.2rem;border:1.5px solid var(--line2);border-radius:999px;font-family:var(--mono);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);background:var(--card);transition:color .3s,border-color .3s;z-index:2}
.intro-skip:hover{color:var(--em);border-color:var(--em)}
/* ---------- chrome (FAIL-SAFE: #app is ALWAYS visible; never gated on JS) ---------- */
#prog{position:fixed;top:0;left:0;right:0;height:3px;z-index:200;background:linear-gradient(90deg,var(--gold),var(--em));transform-origin:left;transform:scaleX(0)}
#app{position:relative;z-index:1}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex
